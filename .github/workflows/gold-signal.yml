name: Gold Signal Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xauusd_live_signal.py --use-state-file

      - name: บันทึกสถานะล่าสุดกลับเข้า repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_signal.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "อัปเดตสัญญาณล่าสุด [skip ci]"
          git push
