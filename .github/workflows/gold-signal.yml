# ไฟล์นี้ทำให้ GitHub รันสคริปต์อัตโนมัติตามช่วงเวลาที่ใช้งานจริง ฟรี ไม่ต้องเปิดคอมตัวเอง
#
# ตารางเวลา (แปลงเป็น UTC แล้ว เพราะ GitHub cron ใช้ UTC เสมอ, ไทย = UTC+7):
#   ช่วงเช็คถี่ทุก 5 นาที (สภาพคล่องสูง/ต้องการความไว):
#     - 06:00-09:59 ไทย (ตื่นมาเช็คตอนเช้า)          = UTC 23:00-02:59
#     - 14:00-15:59 ไทย (Tokyo-London overlap)        = UTC 07:00-08:59
#     - 20:00-22:59 ไทย (London-NY overlap จุดทองของวัน) = UTC 13:00-15:59
#   ช่วงเช็คห่างทุก 30 นาที (สภาพคล่องรอง):
#     - 10:00-13:59 ไทย (ก่อน Tokyo-London overlap)   = UTC 03:00-06:59
#     - 16:00-19:59 ไทย (London เดี่ยว)                = UTC 09:00-12:59
#     - 23:00-00:59 ไทย (หลัง overlap เริ่มเบา)         = UTC 16:00-17:59
#   ช่วงพัก ไม่รันเลย:
#     - 01:00-05:59 ไทย (นอน)                          = UTC 18:00-22:59
#   วันเสาร์-อาทิตย์ (เวลาไทย): ปิดพัก ไม่รันเลยทั้งสองวัน
#   หมายเหตุสำคัญ: cron ของ GitHub นับวันตาม UTC ไม่ใช่เวลาไทย ชั่วโมง UTC 17:00 และ 23:00
#   ตรงกับเวลาไทยของ "วันถัดไป" (ข้ามเที่ยงคืนไทยไปแล้ว) จึงต้องแยกเงื่อนไขวันสำหรับ
#   สองชั่วโมงนี้ต่างหาก ไม่งั้นจะปิด/เปิดผิดวันคลาดเคลื่อน 1 วันช่วงรอยต่อสุดสัปดาห์
#
# วิธีใช้:
# 1. สร้างโฟลเดอร์ชื่อ .github/workflows/ ในโปรเจกต์ GitHub ของคุณ
# 2. เอาไฟล์นี้ไปวางในนั้น (เปลี่ยนชื่อไฟล์เป็น gold-signal.yml ถ้ายังไม่ใช่)
# 3. ตั้งค่า Secrets ชื่อ TELEGRAM_BOT_TOKEN และ TELEGRAM_CHAT_ID ใน repo settings

name: Gold Signal Check

on:
  schedule:
    # ช่วงเช็คถี่ทุก 5 นาที (UTC ชั่วโมงที่ตรงวันเดียวกับไทย): จันทร์-ศุกร์เท่านั้น
    - cron: "*/5 0-2,7-8,13-15 * * 1-5"
    # ช่วงเช็คถี่ทุก 5 นาที ชั่วโมง 23 UTC = ไทยวันถัดไป 06:00 → ต้องเลื่อน dow ไป -1
    - cron: "*/5 23 * * 0-4"
    # ช่วงเช็คห่างทุก 30 นาที (UTC ชั่วโมงที่ตรงวันเดียวกับไทย): จันทร์-ศุกร์เท่านั้น
    - cron: "*/30 3-6,9-12,16 * * 1-5"
    # ช่วงเช็คห่างทุก 30 นาที ชั่วโมง 17 UTC = ไทยวันถัดไป 00:00 → ต้องเลื่อน dow ไป -1
    - cron: "*/30 17 * * 0-4"
  workflow_dispatch: {}   # กดรันเองได้จากหน้า Actions ด้วย (ไว้ทดสอบ)

# อนุญาตให้ workflow commit ไฟล์ state กลับเข้า repo ได้
permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xauusd_live_signal.py --use-state-file

      - name: บันทึกสถานะล่าสุดกลับเข้า repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f last_signal.txt ]; then
            git add last_signal.txt
            git diff --quiet && git diff --staged --quiet || git commit -m "อัปเดตสัญญาณล่าสุด [skip ci]"
            git push
          else
            echo "⚠️ ไม่พบไฟล์ last_signal.txt (สคริปต์อาจดึงราคาไม่สำเร็จในรอบนี้) — ข้าม commit"
          fi
